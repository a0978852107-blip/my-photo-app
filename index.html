<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#6366f1">
    <title>AI Photo & Invoice PWA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Canvas Display Area -->
        <div class="canvas-container">
            <canvas id="mainCanvas"></canvas>
            <div class="no-image-placeholder" id="placeholder">
                <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
                <p>點擊下方按鈕選擇圖片</p>
            </div>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <!-- Image Upload Controls -->
            <div class="upload-controls">
                <button class="btn-primary" id="uploadBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    選擇圖片
                </button>
                <button class="btn-secondary" id="cameraBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                        <circle cx="12" cy="13" r="4"/>
                    </svg>
                    拍照
                </button>
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
                <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
            </div>

            <!-- Tab-specific Controls (Hidden initially) -->
            <div class="tab-controls" id="tabControls" style="display: none;">
                <!-- Invoice Tab Controls -->
                <div class="control-section" id="invoiceControls" style="display: none;">
                    <button class="btn-action" id="extractBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                            <polyline points="10 9 9 9 8 9"/>
                        </svg>
                        智慧辨識發票
                    </button>
                    <div class="result-container" id="ocrResult"></div>
                </div>

                <!-- Filter Tab Controls -->
                <div class="control-section" id="filterControls" style="display: none;">
                    <div class="filter-buttons">
                        <button class="filter-btn" data-filter="japanese">日系風格</button>
                        <button class="filter-btn" data-filter="creamy">奶油肌</button>
                        <button class="filter-btn active" data-filter="none">原圖</button>
                    </div>
                    <div class="slider-container">
                        <label for="intensitySlider">
                            <span>強度</span>
                            <span id="intensityValue">0%</span>
                        </label>
                        <input type="range" id="intensitySlider" min="0" max="100" value="0" step="1">
                    </div>
                </div>

                <!-- AR Tab Controls -->
                <div class="control-section" id="arControls" style="display: none;">
                    <div class="ar-style-selector">
                        <label>耳朵樣式</label>
                        <div class="style-buttons">
                            <button class="style-btn" data-style="classic">經典款</button>
                            <button class="style-btn" data-style="fluffy">蓬鬆款</button>
                            <button class="style-btn" data-style="pointy">尖耳款</button>
                        </div>
                    </div>
                    <div class="ar-color-selector">
                        <label>顏色</label>
                        <div class="color-buttons">
                            <button class="color-btn" data-color="pink" style="background: #FFB6C1;"></button>
                            <button class="color-btn" data-color="white" style="background: #FFFFFF; border: 1px solid #ddd;"></button>
                            <button class="color-btn" data-color="black" style="background: #333333;"></button>
                        </div>
                    </div>
                    <button class="btn-action" id="detectFaceBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                            <line x1="9" y1="9" x2="9.01" y2="9"/>
                            <line x1="15" y1="9" x2="15.01" y2="9"/>
                        </svg>
                        偵測臉部並添加貓耳
                    </button>
                </div>

                <!-- Common Actions -->
                <div class="action-buttons">
                    <button class="btn-secondary" id="resetBtn">重置</button>
                    <button class="btn-primary" id="downloadBtn">下載圖片</button>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation Tabs -->
        <nav class="bottom-tabs">
            <button class="tab-btn active" data-tab="invoice">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                </svg>
                <span>發票辨識</span>
            </button>
            <button class="tab-btn" data-tab="filter">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                </svg>
                <span>美感濾鏡</span>
            </button>
            <button class="tab-btn" data-tab="ar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                    <line x1="9" y1="9" x2="9.01" y2="9"/>
                    <line x1="15" y1="9" x2="15.01" y2="9"/>
                </svg>
                <span>AR 貓耳</span>
            </button>
        </nav>
    </div>

    <!-- Loading Indicator -->
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="spinner"></div>
        <p id="loadingText">處理中...</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
